[project]
name = "workflow-editor"
version = "0.1.0"
description = "Visual editor for Roboflow Inference workflows (local, no API key)."
requires-python = ">=3.10,<3.13"
dependencies = [
    # API surface only — heavyweight ML deps come from the inference repo,
    # which we install separately via `uv pip install -e ../.. --no-deps`
    # followed by its requirements files. Doing it that way avoids resolver
    # conflicts between inference's pinned `uvicorn<=0.22` and our `>=0.30`.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
