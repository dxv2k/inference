[project]
name = "inference-demo"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.5.1",
    "torchvision",
    "ultralytics>=8.3.0",
    "gradio>=4.40.0",
    "opencv-python-headless",
    "pillow",
    "requests",
    "numpy<2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
